name: Release

# Every push to main builds all platforms. When the version in Cargo.toml has
# no release yet, the builds are published as release v<version>.
on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.check.outputs.tag }}
      publish: ${{ steps.check.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run: UNIVERSAL=1 ./scripts/bundle.sh
      - run: ditto -c -k --keepParent target/Rustman.app Rustman-macos-universal.zip
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: Rustman-macos-universal.zip

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - run: Compress-Archive -Path target/release/rustman.exe -DestinationPath Rustman-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: Rustman-windows-x64.zip

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - run: tar -czf Rustman-linux-x64.tar.gz -C target/release rustman
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: Rustman-linux-x64.tar.gz

  publish:
    needs: [version, macos, windows, linux]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: |
            Rustman-macos-universal.zip
            Rustman-windows-x64.zip
            Rustman-linux-x64.tar.gz
          generate_release_notes: true
