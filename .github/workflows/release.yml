name: Release

# Push a tag like v0.2.0 to build every platform and publish a GitHub Release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run: UNIVERSAL=1 ./scripts/bundle.sh
      - run: ditto -c -k --keepParent target/Rustman.app Rustman-macos-universal.zip
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: Rustman-macos-universal.zip

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - run: Compress-Archive -Path target/release/rustman.exe -DestinationPath Rustman-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: Rustman-windows-x64.zip

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - run: tar -czf Rustman-linux-x64.tar.gz -C target/release rustman
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: Rustman-linux-x64.tar.gz

  publish:
    needs: [macos, windows, linux]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            Rustman-macos-universal.zip
            Rustman-windows-x64.zip
            Rustman-linux-x64.tar.gz
          generate_release_notes: true
